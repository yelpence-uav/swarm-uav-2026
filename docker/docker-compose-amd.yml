services:
  swarm_dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        USERNAME: yelpence
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
    image: yelpence_swarm:2026
    container_name: yelpence_swarm_container
    
    # Ağ Ayarları: Host makine ile aynı ağı kullan
    network_mode: host
    ipc: host
    pid: host
    
    # Donanım Erişim İzni (AMD için kritiktir)
    privileged: true

    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=0
      
      # --- AMD / INTEL Grafik Ayarları ---
      # Nvidia ile ilgili her şeyi sildik.
      # Yazılım tabanlı render'ı yasakla (Donanım hızlandırma kullan)
      - LIBGL_ALWAYS_SOFTWARE=0
      
      # Gazebo'yu Ogre2 kullanmaya zorla (AMD'de en kararlı çalışan motor)
      - GZ_SIM_RENDER_ENGINE_BACKEND=ogre2
      
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
    
    volumes:
      # X11 Soketi
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # Proje Dosyaları
      - ../src:/home/yelpence/ros2_ws/src
      - ../scripts:/home/yelpence/ros2_ws/scripts
      - ../sim:/home/yelpence/ros2_ws/sim
      
    # --- DONANIM BAĞLANTILARI ---
    # AMD/Intel kartların Linux'taki adresi burasıdır (/dev/dri)
    devices:
      - /dev/dri:/dev/dri
      - /dev/snd:/dev/snd
              
    stdin_open: true
    tty: true
    command: /bin/bash
