services:
  swarm_dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        # Kullanıcı yapılandırması. create-docker.sh tarafından otomatik doldurulur.
        USERNAME: yelpence
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
    image: yelpence_swarm:2026
    container_name: yelpence_swarm_container

    network_mode: host
    ipc: host
    pid: host
    privileged: true

    devices:
      - "/dev/ttyUSB0:/dev/ttyUSB0"
      - "/dev/ttyAMA0:/dev/ttyAMA0"
      - "/dev/input:/dev/input"
      - "/dev/dri:/dev/dri"

    group_add:
      - video

    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=10
      - XDG_RUNTIME_DIR=/tmp/runtime-yelpence
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - GZ_SIM_RENDER_ENGINE_BACKEND=ogre2
      - __NV_PRIME_RENDER_OFFLOAD=1
      - __GLX_VENDOR_LIBRARY_NAME=nvidia
      - __EGL_VENDOR_LIBRARY_FILENAMES=/usr/share/glvnd/egl_vendor.d/10_nvidia.json

    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw

      # Kaynak kodlar ve scriptler
      - ../scripts:/home/yelpence/ros2_ws/scripts
      - ../sim:/home/yelpence/ros2_ws/sim
      - ../src:/home/yelpence/ros2_ws/src
      - ../.git:/home/yelpence/ros2_ws/.git:ro
      # docker/ mount'u: entrypoint yama dongusu ros2_ws/docker/patches'e
      # bakar; mount olmadan klasor container'da YOKTU ve dongu sessizce
      # bos donuyordu (yamalar hic uygulanmiyordu — 2026-07-16'da yakalandi).
      - ../docker:/home/yelpence/ros2_ws/docker:ro

      # ROS 2 Derleme izolasyonu
      - /home/yelpence/ros2_ws/build
      - /home/yelpence/ros2_ws/install

      # PX4 Derleme izolasyonu
      # PX4'ün host makinenizin içine build klasörü açmasını engeller.
      - /home/yelpence/ros2_ws/src/px4_autopilot/build

    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    stdin_open: true
    tty: true
    command: /bin/bash
