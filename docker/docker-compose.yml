services:
  swarm_dev:
    # İmajın nasıl oluşturulacağını tarif eder
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        # Bu değişkenler build.bash tarafından doldurulacak
        USERNAME: yelpence
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}

    image: yelpence_swarm:2026
    container_name: yelpence_swarm_container

    # Ağ Ayarları: Host makine ile aynı ağı kullan (ROS 2 keşfi için en iyisi)
    network_mode: host
    ipc: host
    pid: host

    # Donanım Erişim İzni
    privileged: true

    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=0
      # --- NVIDIA Rendering ve Performans Ayarları ---
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - GZ_SIM_RENDER_ENGINE_BACKEND=ogre2
      - LIBGL_ALWAYS_SOFTWARE=0
      # Nvidia üzerinden render almayı zorlayan kritik satırlar:
      - __NV_PRIME_RENDER_OFFLOAD=1
      - __GLX_VENDOR_LIBRARY_NAME=nvidia
      # Sürü haberleşmesi için en iyi middleware
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp

    volumes:
      # X11 Soketi (Pencere açabilmek için)
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # Yelpençe Kaynak Kodları (Host -> Container senkronizasyonu)
      # docker-compose dosyasının bir üst klasöründeki 'src'yi içeri bağlar
      - ../src:/home/yelpence/ros2_ws/src
      - ../scripts:/home/yelpence/ros2_ws/scripts
      - ../sim:/home/yelpence/ros2_ws/sim
      - ../tests:/home/yelpence/ros2_ws/tests
      - ../tools:/home/yelpence/ros2_ws/tools
      # Donanım Bağlantıları (GPU ve Giriş Cihazları)
      - /dev/dri:/dev/dri
      - /dev/nvidia0:/dev/nvidia0
      - /dev/nvidiactl:/dev/nvidiactl
      - /dev/nvidia-modeset:/dev/nvidia-modeset

    # Nvidia Runtime Tanımlaması (Docker'ın GPU kullanması için şart)
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]

    group_add:
      - "${VIDEO_GID:-44}"
      - "${RENDER_GID:-107}"
    stdin_open: true
    tty: true
    # Konteyner kapanmasın diye çalışır durumda tutar
    command: /bin/bash
