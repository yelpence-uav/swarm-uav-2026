services:
  swarm_dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        USERNAME: yelpence
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
    image: yelpence_swarm:2026
    container_name: yelpence_swarm_container
    ports:
      - "2222:22"

    network_mode: host
    ipc: host
    pid: host
    privileged: true

    devices:
      - "/dev/ttyUSB0:/dev/ttyUSB0"
      - "/dev/ttyAMA0:/dev/ttyAMA0"
      - "/dev/input:/dev/input"

    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=10
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - GZ_SIM_RENDER_ENGINE_BACKEND=ogre2
      - __NV_PRIME_RENDER_OFFLOAD=1
      - __GLX_VENDOR_LIBRARY_NAME=nvidia

    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /dev/dri:/dev/dri
      - ../src/yelpence_swarm:/home/yelpence/ros2_ws/src/yelpence-src
      - ../scripts:/home/yelpence/ros2_ws/scripts
      - ../sim:/home/yelpence/ros2_ws/sim
      - ./logs:/home/yelpence/.ros/log
      - ../docker/Dockerfile:/home/yelpence/ros2_ws/src/yelpence-src/docker/Dockerfile:ro
      - ../src/requirements.txt:/home/yelpence/ros2_ws/src/requirements.txt:ro

    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    stdin_open: true
    tty: true
    command: /bin/bash
