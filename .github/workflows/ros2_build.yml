name: Yelpence CI Build Check

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".vscode/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ros_build_and_test:
    name: ROS 2 Build and Test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup ROS 2
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: jazzy

      - name: Install Dependencies
        run: |
          sudo apt-get update
          rosdep update
          rosdep install --from-paths src --ignore-src -y --rosdistro jazzy

      - name: Build Workspace
        run: |
          source /opt/ros/jazzy/setup.bash

          touch src/px4_autopilot/COLCON_IGNORE

          colcon build \
            --executor sequential \
            --parallel-workers 1 \
            --event-handlers console_direct+ \
            --cmake-args -DCMAKE_BUILD_TYPE=Release

      - name: Run Linters and Unit Tests
        run: |
          source /opt/ros/jazzy/setup.bash
          [ -f install/setup.bash ] && source install/setup.bash
          colcon test --executor sequential --parallel-workers 1 --event-handlers console_direct+

      - name: Check Test Results
        run: |
          colcon test-result --all

  docker_build_test:
    name: Docker Image Build Test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Docker Image
        run: |
          docker build -t yelpence-swarm-ci-test -f docker/Dockerfile .
