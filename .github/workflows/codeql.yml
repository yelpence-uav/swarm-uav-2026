name: "CodeQL Analysis"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '30 2 * * 1' # Her Pazartesi 02:30'da otomatik tarama

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'python', 'cpp' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # C++ analizi için ROS 2 ortamının kurulması ve bağımlılıkların yüklenmesi gerekir
    - name: Setup ROS 2
      if: matrix.language == 'cpp'
      uses: ros-tooling/setup-ros@v0.7
      with:
        required-ros-distributions: jazzy

    - name: Install Dependencies
      if: matrix.language == 'cpp'
      run: |
        sudo apt-get update
        rosdep update
        rosdep install --from-paths src --ignore-src -y --rosdistro jazzy

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        # Daha katı kurallar ve kalite standartları için aşağıdaki satırı aktif edebilirsiniz:
        # queries: security-extended,security-and-quality

    # C++ kodlarının analizi için derleme komutunun CodeQL tarafından izlenmesi
    - name: Build C++ (ROS 2 Workspace)
      if: matrix.language == 'cpp'
      run: |
        source /opt/ros/jazzy/setup.bash
        colcon build --event-handlers console_direct+

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"
