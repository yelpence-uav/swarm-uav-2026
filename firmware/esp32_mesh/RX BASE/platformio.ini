[env:esp32dev]
platform = espressif32@6.13.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
monitor_filters = esp32_exception_decoder, time
build_flags =
    -D DRONE_ID=0
    ; ^ NOT: bu flag kodda KULLANILMIYOR - gercek drone kimligi
    ; runtime'da MAC adresinden drone_tablo[] ile geliyor.
    -D HAS_PIXHAWK=0
lib_deps =
    https://github.com/mavlink/c_library_v2.git
