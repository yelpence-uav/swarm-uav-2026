[env:esp32dev]
platform = espressif32@6.13.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
monitor_filters = esp32_exception_decoder, time
build_flags =
    -D DRONE_ID=0
    ; ^ NOT: bu flag kodda KULLANILMIYOR - gercek drone kimligi
    ; runtime'da MAC adresinden drone_tablo[] ile geliyor.
    -D HAS_PIXHAWK=0
    ; YKİ hatti coklanmis: kucuk mesh cerceveleri + TIP_RTK (RTCM) ayni porttan
    ; geliyor. Ortak ayristiricinin varsayilan 32 baytlik tamponu bir RTCM
    ; cercevesini (TIP+ID+<=1029B+CRC16, COBS ile ~1040B) alamaz ve her birini
    ; tasma dalinda sessizce dusururdu. 1100 = 1040 + marj.
    ; TX DRONE'da bu flag YOK: oradaki RPi hatti buyuk cerceve tasimiyor,
    ; 32 bayt yeterli ve 2x1100 bayt RAM bosa gitmiyor.
    -D UART_FRAME_BUF_SIZE=1100
; TX DRONE ile ortak mesh_config.h/rtk_handler.h/fail_safe.h/encryption.h
; artik ../common/mesh_shared altinda tek kopya - iki proje de buradan okur.
lib_extra_dirs = ../common
; mavlink/c_library_v2 kaldirildi: HAS_PIXHAWK=0 oldugu surece kod hic
; kullanmiyordu (olu bagimlilik). HAS_PIXHAWK=1 aktif edilince geri eklenir:
; lib_deps =
;     https://github.com/mavlink/c_library_v2.git

; ============================================================================
; HANGI ENV NE ZAMAN?
; ----------------------------------------------------------------------------
; [env:esp32dev]  (VARSAYILAN - USB-TTL adaptor varken bunu kullan)
;     Serial0 (USB)        -> debug konsolu        <- kart takiliyken izlenir
;     Serial2 (GPIO25/26)  -> YKİ telemetri/komut  <- USB-TTL adaptore
;     Serial1              -> ACILMAZ (RTCM_GIRISI_VAR=0)
;   Derle/yukle:  pio run -t upload
;   Debug izle:   pio device monitor -p /dev/ttyUSB0        (CP2102 = ESP)
;   Veri hatti:   /dev/ttyUSB1                              (CH340 = TTL)
;
; [env:esp32dev_tek_usb]  (adaptor YOKKEN yedek yol - tek kablo)
;     Serial0 (USB)        -> YKİ telemetri/komut
;     debug                -> YOK (DBG_* susturulur, hat binary tasiyor)
;   Derle/yukle:  pio run -e esp32dev_tek_usb -t upload
;
; Ikisi de RTCM'i adanmis UART'tan BEKLEMEZ. Hedef mimaride RTCM, YKİ veri
; hattindan TIP_RTK cercevesi olarak gelir. Gercekten ayri bir RTCM giris
; hatti kablolanirsa -D RTCM_GIRISI_VAR=1 ekle (GPIO16/17 pinlerini once
; dogrula, kodda placeholder olarak duruyorlar).
; ============================================================================
[env:esp32dev_tek_usb]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -D TEK_USB_MODU=1

; ADIM 6: RTK saf mantigini (rtk_pure.h, uart_cobs.h — hicbiri Arduino.h'ye
; bagimli degil) donanimsiz host makinede test etmek icin. Calistir:
;   pio test -e native
[env:native]
platform = native
test_framework = unity
lib_extra_dirs = ../common
build_flags =
    -std=gnu++14
    -I../common/mesh_shared
    ; Uretimle AYNI tampon boyutu: [env:esp32dev] de 1100 veriyor. Test ile
    ; uretim ayni kod yolunu kullanmali; 32 ile derlenirse RTCM boyutundaki
    ; cerceve testleri anlamsizlasir (zaten static_assert onu yakalar).
    -D UART_FRAME_BUF_SIZE=1100
    ; REV B code review: ASan/UBSan ile tampon tasmasi/UB siniftaki hatalar
    ; artik testte kendiliginden patlar (bkz rtk_sender.h decoded[] fix'i).
    -fsanitize=address,undefined
    -fno-omit-frame-pointer
    -g -O0
build_unflags =
    -O2
