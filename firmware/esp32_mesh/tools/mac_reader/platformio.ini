; ESP32 MAC adresi okuyucu.
;
; drone_tablo[] ve RX BASE peer tanimlari gercek MAC adresi ister; depoda ilk
; 5 byte sifir placeholder. Bu araci her ESP32'ye sirayla yukleyip MAC'leri
; okuyun, sonra mesh firmware'ine girin.
;
; Calistir:
;   cd firmware/esp32_mesh/tools/mac_reader
;   pio run -t upload && pio device monitor
[env:esp32dev]
platform = espressif32@6.13.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
