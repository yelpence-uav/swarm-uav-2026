[env:esp32dev]
platform = espressif32@6.13.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
monitor_filters = esp32_exception_decoder, time
build_flags =
    -D DRONE_ID=1
    ; ^ NOT: bu flag kodda KULLANILMIYOR - gercek drone kimligi
    ; runtime'da MAC adresinden drone_tablo[] ile geliyor.
    -D HAS_PIXHAWK=0
; RX BASE ile ortak mesh_config.h/rtk_handler.h/fail_safe.h/encryption.h
; artik ../common/mesh_shared altinda tek kopya - iki proje de buradan okur.
lib_extra_dirs = ../common
; mavlink/c_library_v2 kaldirildi: HAS_PIXHAWK=0 oldugu surece kod hic
; kullanmiyordu (olu bagimlilik). HAS_PIXHAWK=1 aktif edilince geri eklenir:
; lib_deps =
;     https://github.com/mavlink/c_library_v2.git

; RPi hatti Serial0'a (GPIO3/GPIO1 = kart uzerindeki RX/TX pinleri) alinir.
; GPIO18/19 uzerinden sahada veri gecmedi; Serial0 pinleri QGC testiyle
; kanitliydi. Derle/yukle:
;   pio run -e esp32dev_serial0 -t upload
; DIKKAT: yukleme sirasinda RPi kablolarini cikar (ayni pinler USB-seri ile
; paylasimli, iki surucu ayni hatta konusur).
[env:esp32dev_serial0]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -D RPI_SERIAL0_MODU=1
