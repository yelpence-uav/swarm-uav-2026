# Yelpençe Sürü İHA — Kamera Parametreleri
# Bu dosya camera_driver düğümünün varsayılan parametrelerini içerir.
# Varsayılan değerler Gazebo Harmonic simülasyonundaki kamera sensörü
# (sim/models/x500_base/model.sdf) ile tutarlı olacak şekilde ayarlanmıştır.
#
# GERÇEK DONANIM GEÇİŞİ:
# Sahaya çıkıldığında bu dosyadaki değerleri Arducam HQ kameranızın
# gerçek kalibrasyon sonuçlarıyla güncelleyin. Özellikle fx, fy, cx, cy
# değerleri OpenCV kalibrasyon (checkerboard) ile elde edilmelidir.

camera_driver:
  ros__parameters:
    agent_id: 1
    device_id: 0

    # Çözünürlük ve FPS
    # Gazebo model.sdf: 1280x720, 15 Hz
    # GERÇEK DONANIM: Arducam HQ 1280x720@30fps destekler.
    # RPi 5 CPU yükü izlenerek fps artırılabilir.
    width: 1280
    height: 720
    fps: 15.0

    # Çalışma modu
    # false = gerçek kamera, true = Gazebo bridge
    sitl_mode: false

    # KAYNAK — 27 Ağustos 2026'da gerçek donanımda ölçüldü.
    #
    # 'v4l2' : cv2.VideoCapture(device_id).
    #          ⚠️ Pi 5 + IMX477'de ÇALIŞMAZ. /dev/video0 = rp1-cfe-csi2_ch0,
    #          yani ham Bayer veren CSI yakalama düğümü — UVC kamera değil.
    #          Bu satırın eski hâli sim döneminden kalan bir varsayımdı.
    # 'http' : deploy/rpi/kamera_yayin.py MJPEG akışını tüketir. Kamerayı
    #          libcamera aracılığıyla o servis açıyor. Konteyner
    #          --network host olduğu için 127.0.0.1 doğrudan erişilir:
    #          --device /dev/video* geçirmeye ve konteyner yeniden
    #          oluşturmaya GEREK YOK.
    #
    # ⚠️ KAMERAYI TEK SÜREÇ AÇAR. 'http' seçildiğinde yayın servisi
    #    koşuyor olmalı:  python3 ~/kamera_yayin.py --port 8080
    source: http
    source_url: http://127.0.0.1:8080/akis

    # ⚠️ Aşağıdaki width/height 'http' kaynakta YALNIZ UYARI için kullanılır
    # — gerçek çözünürlüğü yayın servisinin önizleme ayarı belirler. İkisi
    # tutmuyorsa düğüm "Cozunurluk farkli" uyarısı yazar.

    # Kamera montaj yönü düzeltmesi
    # GERÇEK DONANIM: Kamera drone gövdesine monte edildikten sonra
    # görüntünün doğru yönde olup olmadığını kontrol edin.
    # Ters montaj durumunda flip_vertical: true yapın.
    flip_vertical: false
    flip_horizontal: false

    # Kamera intrinsic parametreleri
    # Gazebo model.sdf horizontal_fov: 1.047 rad (~60°)
    # Aşağıdaki fx/fy değerleri 1280x720 çözünürlük + 60° FOV için
    # hesaplanmış yaklaşık değerlerdir:
    #   fx = (width / 2) / tan(hfov / 2) = 640 / tan(0.5235) ≈ 1108.5
    #
    # GERÇEK DONANIM: Bu değerleri mutlaka OpenCV checkerboard
    # kalibrasyonu ile elde edin. Arducam HQ + 6mm CS lens için
    # gerçek değerler farklı olacaktır.
    # Kalibrasyon komutu:
    #   python3 -m cv2 calibrateCamera ...
    # veya ROS 2 camera_calibration paketi:
    #   ros2 run camera_calibration cameracalibrator \
    #     --size 9x6 --square 0.025 \
    #     image:=/drone_1/camera/image_raw
    # ⚠️ Aşağıdaki fx/fy/cx/cy 1280x720 için yazılmıştı. Akış 4056x3040'a
    # çıkınca 3,17 kat yanlış kalıyordu. `odak_otomatik: true` iken düğüm
    # bunları GERÇEK kare boyutundan kendisi türetiyor; buradakiler yalnız
    # otomatik kapalıyken kullanılır.
    fx: 1108.5
    fy: 1108.5
    cx: 640.0
    cy: 360.0

    # GÖRÜŞ AÇISI — 28 Ağustos 2026'da ÖLÇÜLDÜ, artık varsayım değil.
    # Yöntem: 1,5 m'lik QR, 8,5 m mesafe, 4056x3040 karede 667 piksel.
    #   445 px/m -> kare 9,12 m genişliğinde -> FOV 56,4°
    # Eski değer 1.047 (60,0°) Gazebo modelinden kalmaydı ve %6 sapıyordu:
    # 25 m irtifada kare kenarında ~1,3 m konum hatası demek.
    fov_horizontal_rad: 0.98437   # 56,4 derece (ölçüldü)

    # 4056x3040 için ZORUNLU: ham `sensor_msgs/Image` kare başına 37 MB
    # eder ve DDS'ten hiç geçmez (28 Ağustos'ta denendi, mesaj ulaşmadı).
    # 'compressed' JPEG'i ÇÖZMEDEN aktarır — 1,4 MB.
    yayin_bicimi: compressed
    odak_otomatik: true

    # Kamera sağlık kontrolü — bu süre boyunca frame gelmezse
    # SystemEvent.EVENT_AGENT_FAULT yayınlanır.
    health_timeout_sec: 3.0
